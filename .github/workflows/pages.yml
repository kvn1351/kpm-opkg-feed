name: Build and Deploy OPKG Feed to GitHub Pages

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 04:00 UTC
  workflow_dispatch:      # Manual trigger from Actions tab
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache downloaded KPM artifacts
        uses: actions/cache@v4
        with:
          path: .kpm-cache
          key: kpm-artifacts-${{ hashFiles('sync.py') }}
          restore-keys: |
            kpm-artifacts-

      - name: Sync KPM Repositories and Build OPKG Feeds
        run: |
          python3 sync.py \
            KindleTweaks/Repo \
            KindleModding/repo \
            --out ./dist \
            --cache ./.kpm-cache

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
